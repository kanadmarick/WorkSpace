[project]
name = "workspace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arxiv==1.4.8",
    "gradio>=6.25.0",
    "langchain-ollama>=1.1.0",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.5",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "torch>=2.13.0",
    "pypdf>=6.18.1",
    "pymupdf>=1.28.2",
    "langchain-text-splitters>=1.1.2",
    "sentence-transformers>=6.0.1",
    "faiss-cpu>=1.15.0",
    "chromadb>=1.5.9",
]

[project.scripts]
workspace = "workspace:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["local_models", "AgenticLangGraph", "MCPDemoLangchain", "Debugging_monitor", "Multiagent", "multimodalRAG"]
